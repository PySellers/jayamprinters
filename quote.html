<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote | Srijayam Printers</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Srijayam Printers</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="quote.html">Quote</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>Request a Quote</h2>
      <p>Tell us about your project and get a quick estimate.</p>

      <form class="quote-form" id="quote-form">
        <label for="project">Project Type</label>
        <select id="project" name="project" required>
          <option value="">Select a project</option>
          <option value="flyer">Flyer or Brochure</option>
          <option value="business-card">Business Cards</option>
          <option value="banner">Banner or Poster</option>
          <option value="stationery">Stationery</option>
        </select>

        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1" placeholder="Enter quantity" required />

        <label for="details">Project Details</label>
        <textarea id="details" name="details" rows="5" placeholder="Describe your print job"></textarea>

        <button type="submit">Submit Request</button>
      </form>

      <div id="quote-result" class="quote-result" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Srijayam Printers. All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/quote.js"></script>
</body>
</html>
